<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Resende | Marketing Viral</title>
  <meta name="description" content="Aprenda comigo o segredo para ganhar mais de 1.000 seguidores por dia e transformá-los em clientes.">
  <meta name="theme-color" content="#050403">

  <!-- Compartilhamento (WhatsApp / Instagram / etc.) -->
  <meta property="og:title" content="Resende | Marketing Viral">
  <meta property="og:description" content="Descubra o segredo que me faz ganhar mais de 1.000 seguidores por dia e transformá-los em clientes.">
  <meta property="og:image" content="assets/perfil.jpg">
  <meta property="og:type" content="website">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Fontes: só os pesos usados, com display=swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Mrs+Saint+Delafield&family=Space+Mono&family=Manrope:wght@500;700;800&display=swap">

  <link rel="preload" as="image" href="assets/perfil-360.webp" type="image/webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Camadas de luz do fundo (puramente decorativas) -->
  <div class="bg" aria-hidden="true">
    <span class="bg__glow bg__glow--top"></span>
    <span class="bg__glow bg__glow--side"></span>
    <span class="bg__glow bg__glow--bottom"></span>
    <span class="bg__grain"></span>
  </div>

  <main class="page">

    <!-- ===================== SEÇÃO 1 — IDENTIDADE ===================== -->
    <header class="identity">
      <div class="avatar reveal" style="--d:0">
        <span class="avatar__ring" aria-hidden="true"></span>
        <!-- FOTO DE PERFIL (recortada, fundo transparente): troque os arquivos
             em /assets mantendo os nomes — perfil-360.webp, perfil.webp e
             perfil-360.png (quadrados, com fundo transparente) -->
        <picture>
          <source type="image/webp" srcset="assets/perfil-360.webp 360w, assets/perfil.webp 720w" sizes="108px">
          <img class="avatar__img" src="assets/perfil-360.png"
               width="360" height="360" alt="Foto de Resende" fetchpriority="high" decoding="async">
        </picture>
      </div>

      <h1 class="brand reveal" style="--d:1">
        <span class="brand__name">Resende</span>
        <span class="brand__tag">marketing viral</span>
      </h1>
    </header>

    <!-- ===================== SEÇÃO 2 — CHAMADA ===================== -->
    <section class="pitch" aria-labelledby="pitch-title">
      <h2 id="pitch-title" class="pitch__title reveal" style="--d:2">Aprenda comigo</h2>
      <span class="pitch__arrow reveal" style="--d:3" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 4v15m-6-6 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </section>

    <!-- ============ SEÇÃO 3 — PROTOCOLO VIRAL (banner clicável com CTA) ============
         Para trocar a arte: substitua assets/banner-protocolo.webp
         (mesmo formato retangular, ~1200 x 618 px). Link em config.js. -->
    <section class="protocol reveal" style="--d:4" aria-label="Protocolo Viral">
      <a class="banner" data-link="linkBanner" href="#">
        <div class="banner__inner">
          <img class="banner__img" src="assets/banner-protocolo.webp" width="1200" height="618"
               alt="Protocolo Viral — descubra o segredo que me faz ganhar mais de 1000 seguidores por dia e transformá-los em clientes."
               decoding="async">
        </div>
      </a>
    </section>

    <!-- Frase de fechamento -->
    <p class="closing reveal" style="--d:5">Conteúdo que viraliza.<br>Seguidores que compram.</p>
  </main>

  <script src="config.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
